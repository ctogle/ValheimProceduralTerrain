# ProceduralTerrain — edit and save to hot-reload in-game.
#
# Order below: [Bake]/[Debug] globals, then biome→profile assignments, then profiles
# (a profile lists modes via `modes=`, may inherit via `profiles=`, and may override any
# mode param with `modename.paramname = value`), then the [Pipeline] execution order,
# then the mode definitions. [Mode:surface_blobs] documents every brush parameter.

[Bake]
bakeStep     = 1          # downsample stored bake + tricubic-rehydrate on load (~1/8 file size); 1 = full-res
compressBake = true
bakevanilla  = false      # skip unmodified zones from the bake; they carve live (~11ms) and don't inflate the file
bakeformat   = crossings  # crossings = store columns as sign-crossings (~14x smaller, surface exact); band = dense v5. needs bakeStep=1
bakeCoarseXZ = 1           # carve res DURING pt_bake, XZ (1 = full-res bake quality; independent of live coarseXZ)
bakeCoarseY  = 1           # carve res DURING pt_bake, Y

[Debug]
seed                 =                 # optional: force every NEW world to this seed string (blank = normal/random). Applied at world creation only.
prefetch             = true            # carve-ahead on bg threads for smoother streaming. AUTO-DISABLED on dedicated servers (the gate deadlocks there, and veg-conform carves on-demand so it's not needed). Local/listen gets the perf. hash-excluded.
prefetchRadius       = 2               # zones around player to prefetch (Chebyshev). active area is r=1 (3x3); r=2 = active + 1 lead ring. r=3 for fast travel.
cavecontent          = true            # rung2 POC: spawn additional ore/rocks (+wolves) in mountain caverns
bypass               = false
disableVegetation    = true
protectLocations     = true
locDomeHeight        = 16               # metres the location protection DOME rises over the pad (hemisphere; terrain free above). 0 = full column (open to sky). Live-only (not hashed).
locBandFade          = 8                # metres the location protection tapers out above the dome top. Live-only.
applyGroundwork      = true
corridorGraph        = true             # route canals/sewers off the shared GLOBAL LocationVoronoi graph instead of per-seed windowed Delaunay. A/B: steiner=0 + clearance=0 == pure location Voronoi (functionally equal to legacy)
corridorSteiner      = 500              # Steiner lattice spacing (0 = pure location Voronoi; matches legacy router). densifies corridors across empty cells
corridorClearance    = 40               # prune Steiner within (loc.extR + this) of any location → ≥this/2 (20m) corridor clearance
flatPlaneLocations   = false
islandRemoval        = true
pocketRemoval        = true            # ON — cleared as the cork cause (corks are transient/gen-order; pocketRemoval runs in generation, deterministic per load, not ZDO). cleans stray micro-bubbles
hideLodMeshes        = false            # hide Valheim's distant TerrainLod meshes (inspection aid)
debugViz             = false            # overlay lines: grey=lattice candidate, purple=accepted seed, red=tunnel chain (pt_viz_clear to wipe)
vizMode              =                   # ONLY this mode emits carve debug-viz lines (empty = all modes)
vegViz               = false            # per-tree conform line along checked tilt-normal: green=kept, red=rejected, grey=vanilla(surfH miss)
vegVizRadius         = 250              # viz line cull radius from camera (applies to tunnel viz too); 0 = no cull
debugVizOcclude      = false            # terrain mesh hides overlay lines behind it (filters clutter)
overlap              = 10               # running-field margin (voxels) shared with neighbours; caps seam-free feature reach
fieldDepthLo         = 100              # extend carvable field this many metres below terrain min so deep tunnels stay in-field
surfaceDither        = 0                # off — superseded by fine-scale v6 crossings (see crossSlope). was a band-aid for bake-quantization-induced flat faces.
biomeBlendRadius     = 48
coastFade            = 40               # NOW coastline-distance: inflate Ocean within 40m of the actual OCEAN BIOME (altitude-independent). Suppresses the real coast; inland swamp untouched. 0 = off.
coastStrength        = 1                # gain on the coast Ocean weight — >1 = Ocean dominates the blend (harder coast suppression). 1 = 50/50 at the shore.
riverProtect         = 1                # shoulder sharpness: >1 saturates suppression early (firmer); 1 = pure linear ramp edge→core (softest). 0=off. Hashed → changing it rebakes.
riverCore            = 0.85             # river-weight fraction above which protection is FULL (plateau). Hashed.
riverEdge            = 0.43             # river-weight fraction below which NO protection — raise to pull the OUTER radius inward (tighten band). Hashed.
riverDomeHeight      = 22               # metres the protection DOME rises above water at the channel centre (tapers to the banks → arch, not a flat slab). 0 = flat at water. Hashed.
riverBandFade        = 12               # metres the protection tapers out above the dome top — wide = gradual. Hashed.
biomeBlendSmooth     = true
coarseXZ             = 4                # live perf (bake uses bakeCoarseXZ=1 for full quality)
coarseY              = 4
surfaceFullRes       = true            # surface-anchored modes use a full-res baseline (kills coarse faceting cliffs)
vanillaHeight        = true            # sample ground via vanilla HeightmapBuilder (biome-blended, matches rendered terrain)
blendMode            = sdf             # sdf = bake each present biome and crossfade columns; param = blend params then one bake
composeMode          = sequential      # sequential = compose modes into an iso-coarse running SDF then upsample
eikonal              = false           # TEST: off — are small-feature balls sensitive to the eikonal redistance?
transitionBlurPasses = 0
fixpointmaxzones     = 3

# ── Biome assignments ─────────────────────────────────────────────────────────

[Meadows]
profile = meadows_vox1

[BlackForest]
profile = blackforest_vox1

[Swamp]
profile = swamp_vox1

[Mountain]
profile = mountains_vox1

[Plains]
profile = plains_vox1

[Mistlands]
profile = vanilla_heightmap

[AshLands]
profile = vanilla_heightmap

[DeepNorth]
profile = vanilla_heightmap

[Ocean]
profile = vanilla_heightmap

# ── Profiles ──────────────────────────────────────────────────────────────────

[Profile:vanilla_heightmap]

[Profile:meadows_vox1]
modes       = isotropic_formation
blur_passes = 0
floorDepth  = 0
floorFade   = 0
extendUp    = 12
# Replicate the OLD height-based coastFade (now removed) per-biome: fade formation to 0 as the surface nears sea level.
isotropic_formation.seaAtten  = 0
isotropic_formation.seaFade   = 24
isotropic_formation.seaLevel  = 30

[Profile:blackforest_vox1]
modes            = isotropic_tunnel, isotropic_formation
blur_passes      = 0
floorDepth       = 24
floorFade        = 24
isotropic_formation.amplitude  = 16
isotropic_formation.flare      = 1.8
isotropic_formation.threshold  = 0
isotropic_formation.vScale     = 0.4
isotropic_formation.warpAmp    = 12
isotropic_formation.yOffset    = 0
isotropic_formation.seaAtten   = 0     # replicate old coastFade: fade formation to 0 near sea level (BF)
isotropic_formation.seaFade    = 24
isotropic_formation.seaLevel   = 30
isotropic_tunnel.amplitude   = 0.4
isotropic_tunnel.frequency   = 0.03
isotropic_tunnel.warpAmp     = 3
isotropic_tunnel.vScale      = 0.4
isotropic_tunnel.widthVary   = 0.1

# Scratch profile for the swamp-ball experiment — ONLY the blobs, so we see the primitive clean (no tunnels/formation).
[Profile:swamp_vox1]
modes            = swamp_pedestals, swamp_canals   # hammocks back on (viz stays canal-only via vizMode)
floorDepth       = 24
floorFade        = 24
extendUp         = 26   # headroom for the tall features (amplitude·stretchn + lift)
vegDensity       = 12   # dense canopy on the hammocks (+ maxTilt 30 clothes the slopes)
vegTiltInherit   = 0.9   # 90% of trees LEAN to the ground normal → they hang out over the hammock slopes instead of standing vertical
vegMaxTilt       = 55    # let ground-tilt reach 55° (vanilla clamps low) so leaners really overhang
vegRandTilt      = 22    # + up to 22° of random extra lean regardless of ground → messy encroaching canopy
vegSupportRadius = 1.2   # per-biome: tight footprint → swamp trees creep to the hammock edges & catch more tilt (mountains keep global 2.5)
swamp_pedestals.foresthi  = 10000  # forest gate OFF (POC)
swamp_pedestals.forestlo  = -10000
swamp_pedestals.amplitude = 9      # radius rolls in [minradius, amplitude] → varied mound size → a few m of height variation
swamp_pedestals.minradius = 5
swamp_pedestals.frequency = 0.05   # ~20m lattice, separated
swamp_pedestals.coverage  = 0.5
swamp_pedestals.liftfrac  = 0.5    # = stretchn → base grounded
swamp_pedestals.stretchn  = 0.5    # half height (≈8m tall), same radius + taper
swamp_pedestals.taper     = 0.4    # lean the walls OUT toward the top (overhang over your head)
swamp_pedestals.taperflip = 1      # wide end UP
swamp_pedestals.flatcap   = 1      # flat top/bottom caps (sharp rim, truncated cone)
swamp_pedestals.pnorm     = 2      # round cross-section
swamp_pedestals.fuse      = 1
swamp_pedestals.biomemajority = 0

[Profile:mountains_vox1]
#modes      = isotropic_formation
modes      = isotropic_formation, blob_caves, blob_spines   # A/B: blobs off to isolate their live-carve cost
floorDepth = 100          # carving fades to solid this far below the surface (caps deep pitfalls)
floorFade  = 16
extendUp   = 16
isotropic_formation.amplitude      = 16
isotropic_formation.frequency      = 0.002
isotropic_formation.warpAmp        = 12
isotropic_formation.warpFrequency  = 0.006
isotropic_formation.vScale         = 0.5
isotropic_formation.twist          = 0.008
isotropic_formation.twistVary      = 0.5
isotropic_formation.twistFrequency = 0.02
isotropic_formation.ampVary        = 1
isotropic_formation.ampFrequency   = 0
isotropic_formation.flare          = 0.6

# Plains: a raised rolling mass bored by a sea-level Voronoi sewer (with atriums), stacked strata-floor
# galleries above the sewer, and ledge/ridge bands on the cave walls.
[Profile:plains_vox1]
modes      = isotropic_formation, isotropic_tunnel, plains_sewers, plains_ridges
#modes      = plains_sewers, plains_ridges
floorDepth = 60               # keep the field open well past sea level so the level sewer isn't re-solidified
floorFade  = 8
floorLevel = 20               # re-solidify fades out by y=28 (floorLevel+floorFade) → BELOW the ~28.8 tube floor, so the sewer reaches under the water table (y=30) for a ~1m trail. (was 30, which clamped the floor ~8m too high)
extendUp   = 44               # buffer headroom above vanilla max. must clear isotropic_formation.amplitude (26) + flare/warp, else raised peaks clip flat at the buffer top
composeSmoothY = 1            # plains-ONLY compose-Y anti-alias (kills strata terracing at full res). per-profile → does NOT touch mountains/other biomes
# Rolling mass raised over flat Plains → the land the sewer bores through + its roof.
isotropic_formation.amplitude     = 26
isotropic_formation.frequency     = 0.004
isotropic_formation.warpAmp       = 14
isotropic_formation.warpFrequency = 0.006
isotropic_formation.vScale        = 0.5
isotropic_formation.flare         = 1.8
isotropic_formation.seaAtten      = 0        # fully suppress formation AT the waterline
isotropic_formation.seaFade       = 5        # TIGHT band at the waterline (was 24 = faded 24m of low INLAND land too). gates on the vanilla surface = proximity to the sealevel-crossing line → keeps low inland plains, kills over-water spill
isotropic_formation.seaLevel      = 30
# STACKED GALLERIES: flat horizontal air sheets inside the plains mass — floors to walk between. DEPTH-RELATIVE
# band (tracks the surface per column, so no world-segmentation like the old absolute band). High vScale flattens
# the voids into sheets. altlo is a hard floor just above the sewer ceiling so galleries stay separate.
isotropic_tunnel.amplitude     = 2.5    # sheet openness (bigger = taller/wider galleries, more walkable)
isotropic_tunnel.frequency     = 0.03   # horizontal spacing of the sheets
isotropic_tunnel.vScale        = 5      # flatten voids into floors (was 8 — razor-flat read as terraces)
isotropic_tunnel.warpAmp       = 8
isotropic_tunnel.warpFrequency = 0.01
isotropic_tunnel.altlo         = 42     # hard floor just above the sewer ceiling → galleries separate from sewer
isotropic_tunnel.althi         = 10000  # (depth-relative band below caps the top)
isotropic_tunnel.depthlo       = 3      # solid roof above the TOPMOST gallery (was 6 — "super thick head"). lower = thinner cap / shorter skylights
isotropic_tunnel.depthhi       = 36     # band reaches down to surf−36, but altlo=42 hard-clamps it ABOVE the sewer (~40.6 ceiling) → tall peaks get extra floors, never cuts into the sewer
isotropic_tunnel.bandfade      = 6      # soft ramp at band edges
# STACKED FLOORS (periodic-Y). strataperiod>0 switches this carve from noise-tunnels to horizontal floor-gaps.
isotropic_tunnel.strataperiod    = 9    # floor-to-floor spacing (restored to the liked value)
isotropic_tunnel.stratagap       = 0.75 # ~6.75 m walkable gap, ~2.25 m floor
isotropic_tunnel.stratawobble    = 2    # ±2 m floor-height wobble (not glass-flat)
isotropic_tunnel.strataholefreq  = 0.06 # turned down a bit → bigger, fewer skylight shafts
isotropic_tunnel.strataholethresh= 0.35 # restored (sparse enough; ~40%-breach was the 0.1 value)
isotropic_tunnel.stratataper     = 0.25 # RETRY (smooth-SDF, per-height breach, whole-shaft ramp): mouths flare/pinch by region. ±0.25 shift on a 0.35 thresh
isotropic_tunnel.stratatilt      = 1.5  # slab tilt amplitude (m); < period/2 (=4.5) to avoid floors crossing
isotropic_tunnel.stratatiltfreq  = 0.008 # LONG-wavelength cant (~125m) → broad regional slopes you fight, not noise. (0.03 ≈ 33m read as noise)
isotropic_tunnel.stratataperfreq = 0.03 # XZ scale of the flare-in/flare-out regions
isotropic_tunnel.stratadrift     = 6    # shafts wander ±6 m in XZ as they climb → leaning/meandering, not vertical cutouts
isotropic_tunnel.stratadriftfreq = 0.02 # long slow leans
isotropic_tunnel.stratapillar       = 10   # internal support columns: ties floating slabs to grounded rock (no surface teeth, unlike isoform blobs). m of solid at the pillar core
isotropic_tunnel.stratapillarfreq   = 0.035 # ~28 m pillar spacing
isotropic_tunnel.stratapillarthresh = 0.5  # column density gate (higher = fewer pillars)

# ── Pipeline (execution order) ──────────────────────────────────────────────────

[Pipeline]
#modes = isotropic_formation, isotropic_tunnel
modes = isotropic_formation, isotropic_tunnel, blob_caves, blob_spines, plains_atrium, swamp_pedestals, swamp_canals, plains_sewers, plains_ridges

# ── Modes ───────────────────────────────────────────────────────────────────────
# One canonical instance per mode; biome character comes from per-profile param overrides.

# Domain-warped 3D-noise surface — the base terrain shape.
[Mode:isotropic_formation]
type           = isotropic_formation
blend          = min
amplitude      = 14
frequency      = 0.035
warpamp        = 26
warpfrequency  = 0.01
vscale         = 0.4
threshold      = 0
twist          = 0.001
twistvary      = 0.3
twistfrequency = 0.008
ampvary        = 0.2
ampfrequency   = 0.005
flare          = 0.6
yoffset        = 0
smoothradius   = 0
gradfade       = 0
yanchor        = 0

# Isotropic 3D-noise tunnel network.
[Mode:isotropic_tunnel]
type           = isotropic_tunnel
blend          = smoothmax
amplitude      = 0.6
frequency      = 0.018
warpAmp        = 6
warpFrequency  = 0.012
vScale         = 1.5
widthVary      = 0.5
widthFrequency = 0.008

# Canonical surface_blobs — SDF→SDF operator that stamps oriented shapes onto surfaces.
# This block documents every brush parameter; blob_caves / blob_spines are tuned instances.
[Mode:surface_blobs]
type      = surface_blobs
blend     = min
amplitude = 3            # MAX stamp radius (world units) + on/off gate
frequency = 0.15         # lattice spacing L = 1/freq (auto-clamped to >= 2*amplitude for hard adds)
minradius = 0            # if >0, radius rolls uniformly in [minradius, amplitude]; 0 = fixed
stretchn  = 1            # scale along N (surface normal): >1 spikes/towers, <1 flat scales
stretchg  = 1            # scale along G (downslope): >1 drips/blades running downhill
stretcht  = 1            # scale along T (cross-slope, N×G): >1 ridges along the contour
taper     = 0            # 0 = none, 1 = taper tangential radius to a point toward the +N tip
taperpow  = 1            # taper curve: 1 linear cone, >1 ogive/bullet, <1 trumpet
pnorm     = 2            # cross-section: 2 round, higher = boxy, <2 octahedral/crystalline
# Distribution (which lattice points become stamps)
coverage    = 1          # probabilistic keep per stamp (1 = all)
bias        = 0          # 0 = uniform, 1 = contour (periodic Y → rings), 2 = ridge (periodic aspect → radial ribs)
biasspacing = 20         # contour ring spacing in world Y
biaswidth   = 0.2        # contour band half-width as fraction of spacing (0..0.5)
biasphase   = 0          # contour ring offset
# Gates (keep a stamp only if it passes all; defaults pass everything)
slopelo     = 0          # keep where steepness (deg) >= this. 0=floor, 90=wall, 180=ceiling
slopehi     = 180        # ... and <= this
altlo       = -10000     # keep where stamp world-Y >= this
althi       = 10000      # ... and <= this
clusterfreq = 0          # >0 enables a 2D noise mask (patchy fields)
clusterthresh = 0        # keep where cluster noise >= this (-1..1); higher = sparser
aspectlo    = 0          # keep where slope faces azimuth in [aspectlo,aspecthi] deg
aspecthi    = 360
curvlo      = -9999      # keep where curvature >= this (>0 convex/ridge, <0 concave/hollow)
curvhi      = 9999
ridgeratio  = 0          # >0: place only on convex ridges (fast curvature >= ratio*|slow|), align along the crest
concaveratio = 0         # >0: place only on concave undersides (inverse of ridgeratio)
skyopen     = 1          # 1 = sky-exposed outer surfaces only; 0 = allow internal (cave) surfaces
biomemajority = 0        # 1 = seed only where this biome dominates, at constant (un-blended) radius
# Operator
carve       = 0          # 0 = add, 1 = carve (subtract → pits/caves)
fuse        = 0          # 0 = hard crease between stamps, >0 = smooth metaball melt
# Propagation (carve + chain = tiling tunnels)
chain       = 0          # child stamps walked from each seed (0 = off)
chainstep   = 4          # distance between chain links
chainwander = 0.3        # 0 = straight, higher = winding
chaininward = 0          # 0 = random launch, 1 = straight into the surface (−N)
chainlevel  = 0          # per-step damping of vertical travel toward chainslope
chainslope  = 0          # target downward drift the walk settles to
chaintile   = 0          # 1 = snap seed+walk to the global composed surface so chains tile across zones
branchprob  = 0          # per-step branch probability (0 = linear)
branchangle = 40         # branch turn angle (deg)
branchdepth = 1          # max branch recursion depth
flowsteer   = 0          # 0 = off; steer the walk along a coherent noise flow field
flowfreq    = 0.02
hubseek     = 0          # 0 = off; steer toward deterministic hub points
hubspacing  = 256
keepdepth   = 8          # min depth below surface in the field walk (ignored when chaintile=1)

# Caves that grow inward: sparse mountain-flank mouths, carve a winding tunnel into the rock.
[Mode:blob_caves]
type = surface_blobs
blend = min
amplitude = 9            # MAX link radius; width class + along-path swell vary it organically
minradius = 2.5          # MIN link radius (wider range → more variable, some narrow passages)
frequency = 0.08         # cave mouth spacing
coverage = 0.07          # fraction of mouths kept (sparse)
altlo = -10000
althi = 10000
slopelo = 30             # seed on flanks
slopehi = 150
carve = 1                # subtract → hollow out
fuse = 1.5               # smooth links into a tube (low enough that forks still read)
chain = 44               # tunnel length in links (~220m)
chainstep = 5            # < radius so links overlap into a smooth tube
chainwander = 0.4        # 0 = straight, higher = winding (twistier)
chaininward = 0.8        # launch strongly inward along −N
chainlevel = 0.3         # level-out rate: relax vertical travel toward chainslope each step
chainslope = 0.12        # settle to a gentle downward drift
chaintile = 1            # tile across zones (snap to the global composed surface)
stretchg = 1.8           # elongate ALONG the path → smooth capsule tube, not beads
stretcht = 1.0           # cross-section width
stretchn = 1.0           # cross-section height
pnorm = 3                # cross-section shape (3 ≈ rounded-square)
biomemajority = 1        # only where Mountain dominates, at constant radius (no fade into neighbours)
branchprob = 0
branchangle = 55
branchdepth = 1
flowsteer = 0
flowfreq = 0.02
hubseek = 0
hubspacing = 256
keepdepth = 8            # ignored when chaintile=1

# Spines/teeth running along convex ridgelines (add + convex gate + along-ridge stretch + fuse).
[Mode:blob_spines]
type = surface_blobs
blend = min
amplitude = 2.2          # base radius
minradius = 1.5
frequency = 0.15         # density along the ridge (coverage maxed, so density comes from here)
coverage = 1.0           # the ridge gate does the selection
curvlo = -9999
curvhi = 9999
bias = 0
ridgeratio = 2.5         # place only on sharper convex ridges
stretchg = 2             # elongate ALONG the ridgeline
stretcht = 1
stretchn = 6             # tall (height scales along N; base radius unchanged)
taper = 0.8              # pointed spike
taperpow = 2
fuse = 1
biomemajority = 1        # only where Mountain dominates, at constant size

# Vast atrium halls: big sparse carve-blobs seeded on the raised Plains meat; the profile floorLevel (y30)
# flattens their bottom into a sand+water floor while the dome opens up to ~the surface → cathedral spaces
# the passages (blob_caves) open into. Top often breaches the surface → natural skylight.
[Mode:plains_atrium]
type = surface_blobs
blend = min
carve = 1                # subtract → open chamber
fuse = 2                 # smooth, melt the chain links into one hall
amplitude = 18           # VAST radius (vs blob_caves' 4) → cathedral-scale volume
minradius = 12           # keep them consistently large
frequency = 0.015        # sparse seed lattice (~65m)
coverage = 0.06          # rare — these are landmarks
slopelo = 0
slopehi = 35
altlo = 34               # seed on the raised meat (floor still clamps to y30) → tall halls
althi = 70
chain = 3                # slight elongation → oval hall, not a bare sphere
chainstep = 12
chainwander = 0.3
chaininward = 0.3
chainhorizontal = 1
chainslope = 0
chainlevel = 1
chaintile = 1            # tile across zones
keepdepth = 0
stretchg = 1.5
biomemajority = 1        # Plains-dominant only

# Forest-field pedestals: ADD little mounds wherever vanilla's GetForestFactor says trees are DENSE, so tree
# clusters perch on raised ground. Example of latching a feature onto a native vanilla field (no new noise).
[Mode:swamp_pedestals]
type = surface_blobs
blend = min              # union → ADD solid (raise)
carve = 0                # add, not carve
amplitude = 5            # pedestal radius
minradius = 3
frequency = 0.07         # mound spacing
coverage = 0.6
slopelo = 0              # on flattish swamp ground
slopehi = 20
forestlo = -10           # keep where GetForestFactor is LOW (= dense trees) ...
foresthi = 0.85          # ... the densest clusters only (vanilla in-forest = <1.15)
stretchn = 3             # tall-ish mound (scale up the normal axis)
taper = 0.4              # round the top
taperpow = 1.5
fuse = 1.5               # melt neighbouring mounds into clustered hummocks
biomemajority = 1        # Swamp-dominant only

# Boatable swamp canals: blob-tunnel chains that START at the shoreline (seed where the surface is near sea level)
# and run STRAIGHT inland, carving a ~14m-wide trench centred on sea level so water floods it into an open canal.
[Mode:swamp_canals]
type = surface_blobs
blend = min
carve = 1                # subtract → open the channel
fuse = 2                 # smooth the links into a continuous canal
amplitude = 13.5         # ≈27m wide — narrowed 10%
minradius = 13.5         # constant width
stretchn = 1.3           # height ≈2x radius → deep water + headroom
frequency = 0.03         # canal-mouth spacing along the shore
coverage = 0.52          # ~30% more canal mouths seeded along the shore
slopelo = 0
slopehi = 40
altlo = -10000           # (altitude gate off — coastseed handles shoreline anchoring)
althi = 10000
coastseed = 120          # seed where Ocean is within 120m (wider band while debugging) + aim the chain INLAND
chainroute = 1           # route through the Voronoi location-corridor graph (snake AROUND protected locations) instead of the hashed walk
chain = 120              # ≈600m runs inland (120 × chainstep 5)
chainstep = 5
chainwander = 0.15       # gentle meander
chainhorizontal = 1      # flat swamp → launch horizontal
chaininward = 1          # head straight inland from the shore
chainslope = 0           # stay level
chainlevel = 1           # hold the launch (≈sea-level) elevation
chaintile = 1            # tile across zones → canals run their full length
keepdepth = 0
biomemajority = 0        # place in whatever biome the profile is assigned to

# ── PLAINS SEWERS (experiment) ───────────────────────────────────────────────────
# Voronoi-routed tunnels like the swamp canals, but PLAINS sits above sea level, so a
# sea-level-pinned tube is naturally UNDERGROUND with a terrain roof + a water trail at
# the bottom (global water table y=30). Smaller cross-section than the swamp canals.
[Mode:plains_sewers]
type = surface_blobs
blend = min
carve = 1                # subtract → hollow the tunnel
fuse = 2                 # smooth the links into a continuous tube
amplitude = 6            # tunnel radius (narrower sewer) — WIDTH unchanged
minradius = 6            # constant width
stretchn = 0.9           # shorter ceiling (RN=5.4; was 1.2/7.2)
liftfrac = 0.87          # raised ~1 m: floor ≈29.8 (was 28.8) → shallow water, camera clears it. floor = 30 + liftfrac·6 − 6·stretchn
frequency = 0.03         # mouth spacing along the shore
coverage = 0.85          # mouth density → canal count → atrium frequency (network-driven); 0.6→0.85 = more sewers
slopelo = 0
slopehi = 40
altlo = -10000           # altitude gate off — coastseed anchors the mouths
althi = 10000
coastseed = 120          # seed where Ocean is within 120m, aim inland (same as swamp canals)
chainroute = 1           # Voronoi-routed (snake around protected locations)
chain = 120              # ~600m runs inland
chainstep = 5
chainwander = 0.15
chainhorizontal = 1      # flat plains → launch horizontal
chaininward = 1
chainslope = 0           # stay level at sea level (underground, since plains is raised above)
chainlevel = 1
chaintile = 1
keepdepth = 0
biomemajority = 1        # PLAINS-dominant only → don't bleed sewers into adjacent biomes
atriumradius = 28        # MAX dome radius cap (0 = atriums off). Actual radius derives from floor→surface depth (atriumfill). lowered 40→28 to tame the enormous ones
atriumlift = 0           # extra vertical raise of the dome (fraction of radius); 0 = dome spans floor→ceiling as computed
atriummerge = 300        # cluster merge-junctions within 300m into one atrium
atriumnoise = 0.25       # ±25% per-site height jitter so domes vary
atriumfill = 0.92        # ceiling reaches closer to the surface → a few more domes breach (was 0.85)
atriummindepth = 18      # skip atriums where surface−waterfloor < 18m (no half-exposed rooms)
atriumlumps = 8          # satellites back: lumpy character + they soften hard core edges
atriumangularfrac = 0.35 # ~1/3 of atria mildly faceted, rest round → variety, not uniform boxes
atriumangularp = 3       # gentle facets (3 ≈ subtle; 8+ = cube). live-tunable
breachradius = 0         # SHAFT OFF (A/B test: does the cork survive without the breach pass?) — was 5
breachstep = 4           # shaft stamp spacing

# Horizontal ledge/ridge bands on VERTICAL surfaces, periodic in Y — strata lines on the sewer/atrium walls (and
# any plains cliffs for now; we'll constrain to the caves later). Additive, field-snap so it catches cavity walls,
# runs AFTER plains_sewers so the caves exist. Frame on a wall: N=out of wall, G=down, T=along wall → elongate T.
[Mode:plains_ridges]
type = surface_blobs
carve = 0                # ADDITIVE → ledges protrude from the wall (into the cave)
fuse = 1                 # light smooth
amplitude = 5            # base stamp radius (bigger so bands survive coarse res)
minradius = 3
liftfrac = 0.3           # push the ledge off the wall into the cavity (+N = into the air)
taper = 0                # NO taper — taper cones the stamp to a point off the wall (that was the "spikes")
stretchn = 0.6           # modest protrusion out of the wall (N)
stretchg = 4             # on a VERTICAL wall G is HORIZONTAL → long ledge along the wall
stretcht = 0.7           # on a VERTICAL wall T is VERTICAL → thin band (ledge, not spike)
frequency = 0.16         # ~4× denser lattice on the walls
coverage = 1             # every seed kept
slopelo = 60             # vertical walls only (0=floor, 90=wall, 180=ceiling)
slopehi = 120
altlo = 32               # only above y≈32 (~2 m above the sewer water) — keep ridges off the water trail
althi = 10000
bias = 1                 # CONTOUR: periodic in elevation → horizontal ridge bands
biasspacing = 3.5        # closer bands in Y (more ridges)
biaswidth = 0.3          # wider bands → more seeds pass, thicker ridge
skyopen = -1             # STRICTLY INTERNAL: reject sky-exposed surfaces → cave/sewer/atrium ledges only, no hillside teeth (0 = either, was seeding the surface too)
chaintile = 0            # field-snap (finds cavity walls); zone-local, may seam — constrain later
biomemajority = 1        # Plains only
