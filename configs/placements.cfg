# Beached shipwreck debris around sewer openings (lit, sewer water level) + rarely in atriums (also lit).
# Scatter wreck PIECES. PER-PIECE RULES: each prefab has its pivot offset from its mass by a different amount
# (measured via [PT-pivot]), so each needs its own embed to sit right. Shared params repeated per rule.
# All share the same clusterfreq/thresh so they co-locate into one wreck rather than scattering independently.
#   pivot→centroid Y (local): bow +1.02, stern +0.88, sternpost +2.11, vikingship_front -0.12, frontpiece +0.17
#   embed ≈ that Y so the visual mass sits at the floor (pivot sinks below) instead of floating on an offset pivot.

