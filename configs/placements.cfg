# IVY — facenormal aligns the ivy's FACE (+Z, the way it points when spawned) to the surface normal → lies
# flat on the underside instead of perpendicular. Patchy via the clusterfreq/thresh noise field.
[Placement:plains_ivy]
kind = object
biome = Plains
prefab = vines       # building ivy only. (VineGreen has a different model axis → mixing the two = random 90° offsets)
facenormal = true    # align -Z (ivy face) to EACH crossing's surface normal (gradient-based; floor/ceiling/wall)
inert = true         # strip WearNTear/Plant/Pickable so the ivy persists instead of self-destructing
embed = 0            # TEMP: no sink while we measure the vine pivot (ivy was ending up inside the walls)
lightrange = 20      # geodesic (through-air) reach from a sky opening — pulled in a hair so ivy hugs the openings tighter
clusterfreq = 0.02   # ~50m patches (room-scale, not 160m near-constant) so the gate actually bites locally
clusterthresh = 0.2  # positive → only noise-peaks pass; concentrates the (fps-fine) vine budget into dense CONTIGUOUS beds instead of a thin scatter of lone clumps. raised a hair to tighten each bed further
prob = 1.0           # every placement inside a clump → contiguous
cap = 2000           # denser coverage (light-pruned to lit areas), raised to feed the tighter bed below
spacing = 0.25       # tighter bed on the lit walls → overlapping ivy hides how poorly each quad fits the surface
jitteryaw = 0        # was 180 = full random roll about the facing axis → spun wall ivy every which way (random-looking). off keeps the upright frame
jitterpos = 1.0      # tangent stagger (along wall + vertical) → break the grid-lattice look. (floating was snap/guard, not this)
jitterscale = 0.35   # ±35% size variation
wall = true          # also seed vertical wall faces (lateral pass) → ivy crawls walls/pillars, not just horizontal bands
wallonly = false     # walls + floors/ceilings together now that the wall sampler is proven
wallslopemin = 55    # only near-vertical faces (≥55° from horizontal) — rejects gentle slopes / the top ground
miny = 31            # above the ~30 waterline → no ivy below sea level

