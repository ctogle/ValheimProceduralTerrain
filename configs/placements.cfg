# --- swamp surface scatter (surface=true opts into the TOP crossing = open ground; without it these are cave-only) ---
[Placement:swamp_roots]
kind = object
biome = Swamp
prefab = Greydwarf_Root
prob = 0.30        # own channel; VERY dense root cover
cap = 220
spacing = 1.5
floor = true
surface = true     # place on the open swamp ground, not just sub-surface crossings
minY = 31          # above sea level (~30) → raised hammocks only, skip the flat swamp floor
minNormalY = 0.15  # allow steep flanks → roots cling to the sides of the hammocks
biomepure = 1      # interior swamp only (GetBiomeArea != Edge) → not prolific at the adjacent-biome boundary
embed = 0.5        # tilt to the ground normal (any orientation) but sink the base so they always touch

