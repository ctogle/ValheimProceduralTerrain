biome = Plains
chassis = Spawner_Goblin
floor = true
miny = 28            # above the sewer floor
maxy = 40            # below the strata (altlo=42) → sewer level only
prob = 0.025         # sewer/atrium-area patrols (denser than the strata rule below)
cap = 6
spacing = 8

# Crow stand-in for "beach birds" in the lit openings (true Seagull isn't a placeable prefab — ambient only).
# Birds fly on their own (RandomFlyingBird); place them as inert-free objects near light.
[Placement:plains_atrium_birds]
kind = object
biome = Plains
prefab = Seagal      # the seagull (devs' spelling). Its own RandomFlyingBird → beach vibe; ConfigBird tunes it.
lift = 3             # start them up in the air, not clipped into the floor
atriumonly = 40      # ONLY in the big atrium rooms → a nesting colony per atrium
lightrange = 40      # ...AND only where sky reaches → breached/open atriums only, never a sealed cavern
prob = 0.02
cap = 10             # ~10 birds per atrium (one Crow = one bird; 60 was a literal 60-bird swarm)
spacing = 5
birdlandchance = 0.8     # mostly perched → nesting vibe (default 0.5)
birdlandduration = 14    # stay landed ~14s (default 2) → many landed at any moment
birdnoisemin = 8         # squawk every 8-16s (default 3-6) → present but not comical
birdnoisemax = 16
birdflyrange = 8         # tight roam → stay in the dome, not out the breach
birdminalt = 1           # low flight band...
birdmaxalt = 6           # ...capped so they can't climb out the breach to the surface (default 20 let them escape)

