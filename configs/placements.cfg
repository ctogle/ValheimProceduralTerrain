# ProceduralTerrain — PLACEMENT config. Edit and save to hot-reload in-game.
#
# This file controls WHAT gets placed in the world (vegetation + cave content). Terrain SHAPE is a
# separate file (biomes.cfg). Sections below: [Vegetation], [CaveContent], [Placement:*].

# ── Vegetation ──────────────────────────────────────────────────────────────────
[Vegetation]
disable = false        # skip all tree/bush/rock placement
conform = true         # snap vegetation to the voxel surface (stops trees floating / sinking on carved terrain)
maxTilt = 25           # reject placement where the voxel surface is steeper than this (degrees)

# ── Cave content ────────────────────────────────────────────────────────────────
# Spawns extra ore, scenery, and creatures inside carved caverns, ON TOP OF vanilla (vanilla's own
# spawns are never touched). Each [Placement:*] below is one rule. Rules with no `prob` compete in a
# shared weighted pool (object rules vs each other, spawner rules vs each other); a rule WITH `prob`
# runs as its own independent channel at that per-crossing chance.
[CaveContent]
enabled        = true
objectProb     = 0.009   # per surface-crossing chance the OBJECT pool fires, then a weighted pick places one
objectCap      = 9       # max pooled objects per zone
objectSpacing  = 6       # min metres between pooled objects
spawnerProb    = 0.012   # per floor-crossing chance the SPAWNER pool fires
spawnerCap     = 8       # max pooled spawners per zone
spawnerSpacing = 10

# Placement params:
#   kind      object | spawner           object=static prefab (ore/scenery); spawner=CreatureSpawner chassis
#   biome     Mountain, BlackForest, …   where it applies (or * / all)
#   prefab    name[,alt,…]               object prefab (spawners use `chassis` instead); first that resolves wins
#   chassis   name[,alt,…]               spawner chassis prefab (provides respawn/day-night/trigger behaviour)
#   creature  Wolf                        spawner only: override the creature it emits (blank = chassis native)
#   weight    1                           share within its pool (lower = rarer)
#   prob      -1                          >=0 = own independent channel at this per-crossing chance (skip the pool)
#   cap       -1                          max of THIS rule per zone (-1 = use pool cap)
#   spacing   -1                          min metres between this rule's placements (-1 = use pool spacing)
#   depthMin  0                           nothing spawns above this depth below the surface
#   depthFull -1                          depth where probability reaches full (-1 = hard step at depthMin)
#   zoneChance 1                          fraction of zones eligible at all (independent channels)
#   floor     false                       only on floor crossings (solid below, air above)
#   embed     0                           sink this far (m) into the floor (buried deposits, dug out + Wishbone-findable)
#   cover     0                           require terrain surface this far (m) above the deposit across its footprint — keeps big ore buried, exposed only in tunnels (not poking out a face)
#   upright   false                       force world-up orientation instead of tilting to the floor normal

[Placement:tin]
kind = object
biome = Mountain
prefab = MineRock_Tin
weight = 10
depthFull = 60
cover = 4

