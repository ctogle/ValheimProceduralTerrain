# ProceduralTerrain CLIENT config — local runtime knobs that do NOT affect generated terrain.
# NEVER synced from a server and NEVER part of the cfg hash — your settings always win.

[Bake]
compressbake = true
bakevanilla = false
bakeformat = crossings
bakeradius = 0           # default radius (m) for pt_bake when none is given; 0 = no default (pass one)
[Debug]
seed                 =                 # local world-creation override (blank = random); moot on a server
rollingbake = 1          # bake the area around you as you move — the default play mode
rollinghud = 0           # F8 toggles an on-screen rolling-status + fps panel at runtime
rollingthreads = 6       # background carve workers (1–8, BelowNormal priority); more = faster roll, more CPU contention. Hot-reloadable (resizes the live pool)
rollingradius = 800      # metres carved around you. Hot-reloadable
rollingmovestep = 64     # re-scan after you move this far (one zone)
rollingflushzones = 40   # flush carved zones to disk after this many…
rollingflushseconds = 5  # …or this long since the last flush
bakeautodownload = 0     # auto-pull the server's bake on connect (opt-in; slow for big bakes — rolling fills otherwise)
prefetch = true
prefetchradius = 2
prefetchthreads = 0      # background prefetch workers; 0 = auto (cores/2)
hidelodmeshes = false
hidemist = false         # debug: suppress Mistlands ground mist to see terrain/sewers
lodunderground = true    # hide distant LOD terrain while you're underground (cave/tunnel)
debugviz = false
vizmode = 
vegviz = false
vegvizradius = 250
debugvizocclude = false
coarsexz = 4
coarsey = 4
