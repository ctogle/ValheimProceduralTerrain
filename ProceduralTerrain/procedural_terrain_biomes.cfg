
# ProceduralTerrain — edit and save to hot-reload in-game
#
# Three-tier config: Modes → Profiles → Biomes
#   [Mode:name]     — named terrain primitive (type = lua | native mode name)
#   [Profile:name]  — ordered list of mode names + profile-level params
#                     profiles may override any mode param: modename.paramname = value
#   [BiomeName]     — assigns a profile to a biome
#
# Native C# modes (fast, no GC) are canonical; the matching .lua files are kept for posterity /
# prototyping and can be re-enabled by pointing a profile at the lua mode name.

[Bake]
# reload trigger
bakeStep     = 4

compressBake = true

[Debug]
bypass               = false
disableVegetation    = true
protectLocations     = true
flatPlaneLocations   = false
islandRemoval        = true
pocketRemoval        = true
biomeBlendRadius     = 48
coastFade            = 24
biomeBlendSmooth     = true
coarseMult           = 1                # coarse bake cell = 4*mult voxels (0.5=2m, 1=4m, 2=8m, 4=16m; 0.25=1m per-voxel). Sweep to test coarse-resolution faceting.
surfaceFullRes       = true             # true = surface-anchored modes (formation) use full-res addh baseline (kills coarse faceting cliffs); false = old coarse baseline
vanillaHeight        = true             # true = sample ground via vanilla HeightmapBuilder (biome-blended, matches rendered terrain); false = raw single-biome GetHeight (steps at biome borders)
blendMode            = sdf                # param = blend params then one bake (chirps at freq boundaries); sdf = bake each present biome, crossfade columns
transitionBlurPasses = 0
fixpointmaxzones     = 3


# ── Primitives ────────────────────────────────────────────────────────────────
# One canonical instance per mode. Biome character is expressed via per-profile param overrides.

# Native C# isotropic formation (canonical). Domain-warped 3D-noise surface.
[Mode:isotropic_formation]
type           = isotropic_formation
blend          = min
amplitude      = 14
frequency      = 0.035
warpamp        = 26
warpfrequency  = 0.01
vscale         = 0.4
threshold      = 0
twist          = 0.001
twistvary      = 0.3
twistfrequency = 0.008
ampvary        = 0.2
ampfrequency   = 0.005
flare          = 0.6
yoffset        = 0
smoothradius   = 0
gradfade       = 0
yanchor        = 0

# Native C# isotropic tunnel network (canonical).
[Mode:isotropic_tunnel]
type           = isotropic_tunnel
blend          = smoothmax
amplitude      = 0.6
frequency      = 0.018
warpAmp        = 6
warpFrequency  = 0.012
vScale         = 1.5
widthVary      = 0.5
widthFrequency = 0.008

# Lua prototype of isotropic_formation (posterity / bench).
[Mode:formation_dev]
type           = lua
file           = isotropic_formation.lua
blend          = min
amplitude      = 14
frequency      = 0.035
warpamp        = 26
warpfrequency  = 0.01
vscale         = 0.4
threshold      = 0
twist          = 0.001
twistvary      = 0.3
twistfrequency = 0.008
ampvary        = 0.2
ampfrequency   = 0.005
flare          = 0.6
yoffset        = 0
smoothradius   = 0
gradfade       = 0
yanchor        = 0

# Lua prototype of isotropic_tunnel (posterity / bench).
[Mode:tunnel_carve]
type           = lua
file           = isotropic_tunnel.lua
blend          = smoothmax
amplitude      = 0.6
frequency      = 0.018
warpAmp        = 6
warpFrequency  = 0.012
vScale         = 1.5
widthVary      = 0.5
widthFrequency = 0.008
yOffset        = 0

[Mode:anisotropic_formation]
type       = lua
file       = anisotropic_formation.lua
blend      = min
amplitude  = 16
freqT      = 0.001
freqN      = 0.03
blurRadius = 128
alignment  = 0
vScale     = 0.05
gradFade   = 0.15
seaFade    = 0

[Mode:band_carve]
type           = lua
file           = band_carve.lua
blend          = max
amplitude      = 24
yOffset        = -30
warpAmp        = 60
warpFrequency  = 0.012
noiseFrequency = 0.05
vScale         = 0.3
noiseAmp       = 8
twist          = 0

# Gabor radial ridges (features run down the slope). Frame from real terrain gradient.
[Mode:gabor_ridges]
type           = lua
file           = radial_formation.lua
blend          = min
surfaceAnchored = true
amplitude   = 12
contour     = 0
featureAmp  = 12
gaborCell   = 40
gaborFreq   = 0.03
gaborRadius = 40
gaborAniso  = 8
slopeFade   = 0.05
blurRadius  = 40

# Elevation contour rings (features wrap horizontally around hills).
[Mode:contour_rings]
type           = lua
file           = radial_formation.lua
blend          = min
surfaceAnchored = true
amplitude   = 8
contour     = 1
featureAmp  = 8
slopeFade   = 0.05
blurRadius  = 40
ringFreq    = 0.06
ringWarp    = 4
ringWarpF   = 0.01

[Mode:dunes]
type      = lua
file      = dunes.lua
blend     = min
amplitude = 60
frequency = 0.008
pinch     = 2.0

# Sparse terraced islands (archipelago). Prototype in lua; iterate then port to C#.
[Mode:layered_isles]
type        = lua
file        = layered_isles.lua
blend       = min
amplitude   = 1
maskfreq    = 0.01
islethresh  = 0.32
islefade    = 0.12
islandbase  = 3
bluffheight = 30
layerstep   = 5
terrace     = 0.75
flare       = 2
noiseamp    = 2
noisefreq   = 0.05
detailfreq  = 0.03
warpamp     = 45
warpfreq    = 0.008
chanfreq    = 0.02
chanwidth   = 0.35
chancarve   = 0
chanwarp    = 25
chanwarpf   = 0.01

# ── Pipeline ──────────────────────────────────────────────────────────────────

[Pipeline]
modes = isotropic_formation, layered_isles, anisotropic_formation, formation_dev, dunes, gabor_ridges, contour_rings, isotropic_tunnel, band_carve, tunnel_carve

