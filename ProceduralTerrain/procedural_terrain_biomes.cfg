
# ProceduralTerrain — edit and save to hot-reload in-game
#
# Three-tier config: Modes → Profiles → Biomes
#   [Mode:name]     — named terrain primitive (type A/B/C/D + params)
#   [Profile:name]  — ordered list of mode names + profile-level params
#                     profiles may override any mode param: modename.paramname = value
#   [BiomeName]     — assigns a profile to a biome
#

[Bake]
bakeStep     = 4
compressBake = true

[Debug]
bypass               = false
disableVegetation    = true
protectLocations     = true
flatPlaneLocations   = true
islandRemoval        = true
pocketRemoval        = true
biomeBlendRadius     = 32
coastFade            = 48
seaLevelFade         = 20
seaLevelAtten        = 0.2
biomeBlendSmooth     = true
transitionBlurPasses = 0
fixpointmaxzones     = 3


# ── Primitives ────────────────────────────────────────────────────────────────
# One canonical instance per mode type. Biome character is expressed via
# per-profile param overrides rather than separate named mode instances.

[Mode:formation_dev]
type           = lua
file           = formation_dev.lua
blend          = min
amplitude      = 14
frequency      = 0.035
warpamp        = 26
warpfrequency  = 0.01
vscale         = 0.4
threshold      = 0
twist          = 0.001
twistvary      = 0.3
twistfrequency = 0.008
ampvary        = 0.2
ampfrequency   = 0.005
flare          = 0.6
yoffset        = 0
smoothradius   = 0
gradfade       = 0
yanchor        = 0

[Mode:anisotropic_formation]
type       = lua
file       = anisotropic_formation.lua
blend      = min
amplitude  = 16
freqT      = 0.001
freqN      = 0.005
blurRadius = 128
alignment  = 1
vScale     = 0.1
gradFade   = 0.15
seaFade    = 0

[Mode:band_carve]
type           = lua
file           = band_carve.lua
blend          = max
amplitude      = 24
yOffset        = -30
warpAmp        = 60
warpFrequency  = 0.012
noiseFrequency = 0.05
vScale         = 0.3
noiseAmp       = 8
twist          = 0

[Mode:tunnel_carve]
type           = lua
file           = tunnel_carve.lua
blend          = smoothmax
amplitude      = 0.6
frequency      = 0.018
warpAmp        = 6
warpFrequency  = 0.012
vScale         = 1.5
widthVary      = 0.5
widthFrequency = 0.008
yOffset        = 0

[Mode:dunes]
type      = lua
file      = dunes.lua
blend     = min
amplitude = 60
frequency = 0.008
pinch     = 2.0

# ── Pipeline ──────────────────────────────────────────────────────────────────

[Pipeline]
modes = anisotropic_formation, formation_dev, band_carve, tunnel_carve, dunes

