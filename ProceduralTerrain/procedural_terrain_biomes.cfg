
# ProceduralTerrain — edit and save to hot-reload in-game
#
# Three-tier config: Modes → Profiles → Biomes
#   [Mode:name]     — named terrain primitive (type = lua | native mode name)
#   [Profile:name]  — ordered list of mode names + profile-level params
#                     profiles may override any mode param: modename.paramname = value
#   [BiomeName]     — assigns a profile to a biome
#
# Native C# modes (fast, no GC) are canonical; the matching .lua files are kept for posterity /
# prototyping and can be re-enabled by pointing a profile at the lua mode name.

[Bake]
# reload trigger
bakeStep     = 4

compressBake = true

[Debug]
bypass               = false
disableVegetation    = true
protectLocations     = true
flatPlaneLocations   = false
islandRemoval        = true
pocketRemoval        = true
probeLuaSkip         = false
probeLuaNoiseZero    = false
biomeBlendRadius     = 32
coastFade            = 24
seaLevelFade         = 20
seaLevelAtten        = 0.2
biomeBlendSmooth     = true
transitionBlurPasses = 0
fixpointmaxzones     = 3


# ── Primitives ────────────────────────────────────────────────────────────────
# One canonical instance per mode. Biome character is expressed via per-profile param overrides.

# Native C# isotropic formation (canonical). Domain-warped 3D-noise surface.
[Mode:isotropic_formation]
type           = isotropic_formation
blend          = min
amplitude      = 14
frequency      = 0.035
warpamp        = 26
warpfrequency  = 0.01
vscale         = 0.4
threshold      = 0
twist          = 0.001
twistvary      = 0.3
twistfrequency = 0.008
ampvary        = 0.2
ampfrequency   = 0.005
flare          = 0.6
yoffset        = 0
smoothradius   = 0
gradfade       = 0
yanchor        = 0

# Native C# isotropic tunnel network (canonical).
[Mode:isotropic_tunnel]
type           = isotropic_tunnel
blend          = smoothmax
amplitude      = 0.6
frequency      = 0.018
warpAmp        = 6
warpFrequency  = 0.012
vScale         = 1.5
widthVary      = 0.5
widthFrequency = 0.008
yOffset        = 0

# Lua prototype of isotropic_formation (posterity / bench).
[Mode:formation_dev]
type           = lua
file           = isotropic_formation.lua
blend          = min
amplitude      = 14
frequency      = 0.035
warpamp        = 26
warpfrequency  = 0.01
vscale         = 0.4
threshold      = 0
twist          = 0.001
twistvary      = 0.3
twistfrequency = 0.008
ampvary        = 0.2
ampfrequency   = 0.005
flare          = 0.6
yoffset        = 0
smoothradius   = 0
gradfade       = 0
yanchor        = 0

# Lua prototype of isotropic_tunnel (posterity / bench).
[Mode:tunnel_carve]
type           = lua
file           = isotropic_tunnel.lua
blend          = smoothmax
amplitude      = 0.6
frequency      = 0.018
warpAmp        = 6
warpFrequency  = 0.012
vScale         = 1.5
widthVary      = 0.5
widthFrequency = 0.008
yOffset        = 0

[Mode:anisotropic_formation]
type       = lua
file       = anisotropic_formation.lua
blend      = min
amplitude  = 16
freqT      = 0.001
freqN      = 0.03
blurRadius = 128
alignment  = 0
vScale     = 0.05
gradFade   = 0.15
seaFade    = 0

[Mode:band_carve]
type           = lua
file           = band_carve.lua
blend          = max
amplitude      = 24
yOffset        = -30
warpAmp        = 60
warpFrequency  = 0.012
noiseFrequency = 0.05
vScale         = 0.3
noiseAmp       = 8
twist          = 0

# Gabor radial ridges (features run down the slope). Frame from real terrain gradient.
[Mode:gabor_ridges]
type        = lua
file        = radial_formation.lua
blend       = min
amplitude   = 12
contour     = 0
featureAmp  = 12
gaborCell   = 40
gaborFreq   = 0.03
gaborRadius = 40
gaborAniso  = 8
slopeFade   = 0.04
blurRadius  = 40

# Elevation contour rings (features wrap horizontally around hills).
[Mode:contour_rings]
type        = lua
file        = radial_formation.lua
blend       = min
amplitude   = 8
contour     = 1
featureAmp  = 8
slopeFade   = 0.05
blurRadius  = 40
ringFreq    = 0.06
ringWarp    = 4
ringWarpF   = 0.01

[Mode:dunes]
type      = lua
file      = dunes.lua
blend     = min
amplitude = 60
frequency = 0.008
pinch     = 2.0

# ── Pipeline ──────────────────────────────────────────────────────────────────

[Pipeline]
modes = isotropic_formation, isotropic_tunnel, anisotropic_formation, formation_dev, band_carve, tunnel_carve, dunes, gabor_ridges, contour_rings

