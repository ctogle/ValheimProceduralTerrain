[config]
schemaVersion = "0.0.1"

[package]
namespace = "ctogle"
name = "ProceduralTerrain"
versionNumber = "0.1.0"
description = "Procedural terrain system for the voxel inclined."
websiteUrl = "https://github.com/ctogle/ValheimProceduralTerrain"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2333"
Voxheim-Voxheim = "0.1.3"

[build]
icon = "./icon.png"
readme = "./README_thunderstore.md"
outdir = "./dist"

[[build.copy]]
source = "./ProceduralTerrain/bin/Release/netstandard2.1/ProceduralTerrain.dll"
target = "plugins/ProceduralTerrain.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "./procedural_terrain_biomes.example.cfg"
target = "config/procedural_terrain_biomes.example.cfg"

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
valheim = ["mods", "client-side", "world-generation", "ai-generated"]
