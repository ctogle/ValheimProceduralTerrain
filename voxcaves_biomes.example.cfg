# VoxCaves — edit and save to hot-reload in-game
#
# Define profiles with [Profile:name], assign to biomes with:
#   profile = name
# Params listed directly in a [BiomeName] section override the profile.
#
# ── Full parameter reference (copy to start a new profile) ─────────────
# [Profile:my_profile]
# floorDepth            = 8      # how far below heightmap modes A+B stop carving
# # Mode B — carves a band of air around the heightmap surface
# modeB_strength        = 0      # 0=off 1=full
# modeB_radius          = 6      # half-thickness of carved band (world units)
# modeB_warpAmp         = 80     # XZ warp displacement (world units)
# modeB_warpFrequency   = 0.005  # spatial frequency of XZ warp
# modeB_vScale          = 0.5    # Y scale for 3D wall-noise (low=flat, high=vertical)
# modeB_noiseAmp        = 0      # 3D SDF perturbation on band walls (world units; 0=off)
# modeB_yOffset         = 0      # push band centre N units below surface (0=trench; >mbR=enclosed cave)
# # Mode A — 3D noise tunnel network (punches through Mode C solid)
# modeA_strength        = 0      # 0=off 1=full
# modeA_width           = 0.5    # tunnel size (noise threshold 0-1)
# modeA_frequency       = 0.02   # spatial frequency of tunnel noise
# modeA_warpAmp         = 5      # 3D domain-warp displacement
# modeA_warpFrequency   = 0.02   # spatial frequency of domain warp
# modeA_vScale          = 0.1    # Y stretch (low=vertical trenches, high=horizontal tunnels)
# modeA_widthVary       = 1      # tunnel-width spatial variation (0=uniform)
# modeA_widthFrequency  = 0.02   # spatial frequency of width variation
# # Mode C — 3D density field raising solid terrain above the heightmap
# modeC_strength        = 0      # 0=off 1=full
# modeC_threshold       = 0      # iso-surface offset (-1..1; 0=half solid)
# modeC_noiseAmp        = 10     # height of raised terrain (world units)
# modeC_frequency       = 0.015  # spatial frequency of 3D density noise
# modeC_warpAmp         = 8      # XZ anchor-point warp displacement
# modeC_warpFrequency   = 0.005  # spatial frequency of anchor warp
# modeC_vScale          = 0.4    # Y stretch (higher = more overhangs/cliffs)
# modeC_twist           = 0      # XZ rotation per world-unit Y (radians/m)
# modeC_twistVary       = 0      # per-XZ twist-scale variation (0=uniform)
# modeC_twistFrequency  = 0.003  # spatial frequency of twist variation
# modeC_ampVary         = 0      # height variation amplitude (0=uniform)
# modeC_ampFrequency    = 0.003  # spatial frequency of height variation
# # Blur / smoothing
# blur_passes           = 0      # smoothing iterations (0=off)
# perona_k              = 0      # 0=Gaussian; >0=Perona-Malik anisotropic diffusion
#                                #   K is edge threshold in SDF units (try 1-4)
#                                #   lower K = sharper edges preserved, higher = more like Gaussian
# perona_lambda         = 0.1    # PM diffusion rate per pass (must be < 0.166)
# ─────────────────────────────────────────────────────────────────────────

[Debug]
disableVegetation    = true
protectLocations     = false
islandRemoval        = true
pocketRemoval        = true
biomeBlendRadius     = 32    # world units; distance over which biome profiles blend
coastFade            = 12   # world units above sea level (30) over which Ocean inflates into blend
biomeBlendSmooth     = true # true=smoothstep (S-curve), false=linear
transitionBlurPasses = 1     # min blur passes for any zone with active modes
fixpointmaxzones     = 3

[Profile:vanilla_heightmap]
modeB_radius      = 0
modeA_width       = 0
modeC_noiseAmp    = 0
modeC_warpAmp     = 0

