# ── Profiles ──────────────────────────────────────────────────────────────────

[Profile:vanilla_heightmap]
# No modes — vanilla heightmap only

[Profile:meadows_vox2]
modes      = meadows_vox2_c
blur_passes = 1
floorDepth  = 24
floorFade   = 48

[Profile:meadows_vox1]
modes      = meadows_vox1_c
floorDepth  = 4

[Profile:rumple]
modes = rumple_c

[Profile:bored]
modes = bored_a

[Profile:boredrumple]
modes      = rumple_c, bored_a
floorDepth = 24
floorFade  = 4

[Profile:blank]
modes = coastal_ridges

[Profile:strata]
modes = strata_c

[Profile:plains_vox1]
include    = strata
floorDepth = 24
floorFade  = 48

[Profile:spire]
modes       = spire_c
blur_passes = 1
floorDepth  = 24
floorFade   = 48

[Profile:fin]
modes = fin_c

[Profile:arch]
modes = arch_c

[Profile:shelf]
modes = shelf_c

[Profile:torn]
modes       = torn_a
blur_passes = 8
floorDepth  = 16
floorFade   = 8

[Profile:cave]
modes = cave_a

[Profile:karst]
modes = karst_b

[Profile:plains_arches]
modes       = plains_arches_c
blur_passes = 1
floorDepth  = 24
floorFade   = 48

[Profile:swamp_vox1]
modes       = swamp_vox1_c
blur_passes = 1
floorDepth  = 8
floorFade   = 12

[Profile:blackforest_vox1]
modes       = blackforest_vox1_a, blackforest_vox1_c
blur_passes = 1
floorDepth  = 24
floorFade   = 48

[Profile:mountains_vox2]
modes      = mountains_vox2_c
floorDepth = 48

[Profile:mountains_vox1]
modes      = mountains_vox1_a, mountains_vox1_c
floorDepth = 24
floorFade  = 8

# ── Pipeline ──────────────────────────────────────────────────────────────────
# Explicit global execution order for all active modes.
# A mode defined above but omitted here will never run.

[Pipeline]
modes = karst_b, coastal_ridges, meadows_vox2_c, meadows_vox1_c, rumple_c, strata_c, spire_c, fin_c, arch_c, shelf_c, plains_arches_c, swamp_vox1_c, blackforest_vox1_c, mountains_vox2_c, mountains_vox1_c, bored_a, torn_a, cave_a, blackforest_vox1_a, mountains_vox1_a

# ── Biome assignments ─────────────────────────────────────────────────────────

[Meadows]
profile = meadows_vox2

[BlackForest]
profile = blackforest_vox1

[Swamp]
profile = swamp_vox1

[Mountain]
profile = mountains_vox1

[Plains]
profile = blank

[Mistlands]
profile = meadows_vox1

[AshLands]
profile = meadows_vox1

[DeepNorth]
profile = meadows_vox1

[Ocean]
profile = vanilla_heightmap
