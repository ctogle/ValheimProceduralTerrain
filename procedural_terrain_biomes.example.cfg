
# ProceduralTerrain — edit and save to hot-reload in-game
#
# Three-tier config: Modes → Profiles → Biomes
#   [Mode:name]     — named terrain primitive (type = lua | native mode name)
#   [Profile:name]  — ordered list of mode names + profile-level params
#                     profiles may override any mode param: modename.paramname = value
#   [BiomeName]     — assigns a profile to a biome
#
# Native C# modes (fast, no GC) are canonical; the matching .lua files are kept for posterity /
# prototyping and can be re-enabled by pointing a profile at the lua mode name.

[Bake]
# reload trigger
bakeStep     = 1

compressBake = true

[Debug]
bypass               = false
disableVegetation    = true
protectLocations     = true
applyGroundwork      = true             # DIAGNOSTIC: off = pure vanilla baseline (no location groundwork)
flatPlaneLocations   = false
islandRemoval        = true
pocketRemoval        = true
hideLodMeshes        = false           # DEBUG: hide Valheim's distant TerrainLod meshes so they don't occlude voxel features when inspecting
debugViz             = false           # DEBUG: overlay lines — grey=lattice candidate, purple=accepted seed (along normal), red=tunnel chain (pt_viz_clear to wipe)
debugVizOcclude      = true           # true = terrain mesh hides overlay lines behind it (filters clutter); false = draw through everything
overlap              = 10               # running-field margin (voxels) shared with neighbours; caps seam-free feature reach (4 default; higher = bigger seam-free blobs, ~11%/voxel cost)
fieldDepthLo         = 100              # extend carvable field this many metres BELOW terrain min so tunnels stay in-field (matched to floorDepth; lower = cheaper field)
biomeBlendRadius     = 48
coastFade            = 24
biomeBlendSmooth     = true
coarseXZ             = 2                # coarse bake cell size in voxels, XZ (4=default/4m; higher=cheaper/blockier). Whole-bake XZ resolution.
coarseY              = 2                # Path B running-field cell size in voxels, Y (1=full-res/1m; higher=cheaper/less vertical detail). [blob-test: was 4; rad=3 blobs need Y-cell <= rad]
surfaceFullRes       = true             # true = surface-anchored modes (formation) use full-res addh baseline (kills coarse faceting cliffs); false = old coarse baseline
vanillaHeight        = true             # true = sample ground via vanilla HeightmapBuilder (biome-blended, matches rendered terrain); false = raw single-biome GetHeight (steps at biome borders)
blendMode            = sdf                # param = blend params then one bake (chirps at freq boundaries); sdf = bake each present biome, crossfade columns
composeMode          = sequential             # legacy = per-voxel blend (current); sequential = Path B (compose modes into iso-coarse running SDF + eikonal, then upsample)
eikonal              = true            # redistance running field to true distance after each mode (only needed by distance-metric modes like surface_blobs)
transitionBlurPasses = 0
fixpointmaxzones     = 3


# ── Primitives ────────────────────────────────────────────────────────────────
# One canonical instance per mode. Biome character is expressed via per-profile param overrides.

# Native C# isotropic formation (canonical). Domain-warped 3D-noise surface.
[Mode:isotropic_formation]
type           = isotropic_formation
blend          = min
amplitude      = 14
frequency      = 0.035
warpamp        = 26
warpfrequency  = 0.01
vscale         = 0.4
threshold      = 0
twist          = 0.001
twistvary      = 0.3
twistfrequency = 0.008
ampvary        = 0.2
ampfrequency   = 0.005
flare          = 0.6
yoffset        = 0
smoothradius   = 0
gradfade       = 0
yanchor        = 0

# Native C# isotropic tunnel network (canonical).
[Mode:isotropic_tunnel]
type           = isotropic_tunnel
blend          = smoothmax
amplitude      = 0.6
frequency      = 0.018
warpAmp        = 6
warpFrequency  = 0.012
vScale         = 1.5
widthVary      = 0.5
widthFrequency = 0.008

# Lua prototype of isotropic_formation (posterity / bench).
[Mode:formation_dev]
type           = lua
file           = isotropic_formation.lua
blend          = min
amplitude      = 14
frequency      = 0.035
warpamp        = 26
warpfrequency  = 0.01
vscale         = 0.4
threshold      = 0
twist          = 0.001
twistvary      = 0.3
twistfrequency = 0.008
ampvary        = 0.2
ampfrequency   = 0.005
flare          = 0.6
yoffset        = 0
smoothradius   = 0
gradfade       = 0
yanchor        = 0

# Lua prototype of isotropic_tunnel (posterity / bench).
[Mode:tunnel_carve]
