noiseAmp       = 8
twist          = 0

# Gabor radial ridges (features run down the slope). Frame from real terrain gradient.
[Mode:gabor_ridges]
type           = lua
file           = radial_formation.lua
blend          = min
surfaceAnchored = true
amplitude   = 12
contour     = 0
featureAmp  = 12
gaborCell   = 40
gaborFreq   = 0.03
gaborRadius = 40
gaborAniso  = 8
slopeFade   = 0.05
blurRadius  = 40

# Elevation contour rings (features wrap horizontally around hills).
[Mode:contour_rings]
type           = lua
file           = radial_formation.lua
blend          = min
surfaceAnchored = true
amplitude   = 8
contour     = 1
featureAmp  = 8
slopeFade   = 0.05
blurRadius  = 40
ringFreq    = 0.06
ringWarp    = 4
ringWarpF   = 0.01

[Mode:dunes]
type      = lua
file      = dunes.lua
blend     = min
amplitude = 60
frequency = 0.008
pinch     = 2.0

# SDF->SDF operator: unions balls onto every surface (incl. cave ceilings) via |D|. Needs eikonal=true.
[Mode:surface_blobs]
type      = surface_blobs
blend     = min
amplitude = 3            # MAX ball radius (world units) + on/off gate. reach must be <= running-field overlap (4m); L auto-clamped to >= 2*amplitude
frequency = 0.15         # lattice spacing L = 1/freq ≈ 6.7m (auto-clamped to >= 2*amplitude)
minradius = 0            # if >0, each ball's radius is rolled uniformly in [minradius, amplitude]; 0 = fixed radius
stretchn  = 1            # scale along N (surface normal): >1 spikes/towers, <1 flat scales/shields
stretchg  = 1            # scale along G (downslope/gradient): >1 drips/blades running downhill
stretcht  = 1            # scale along T (cross-slope, N×G): >1 ridges/scales along the contour
taper     = 0            # 0 = none, 1 = taper tangential radius to a point toward the +N tip (cones/crystals)
taperpow  = 1            # taper curve: 1 linear cone, >1 ogive/bullet, <1 trumpet
pnorm     = 2            # cross-section exponent: 2 round, higher = boxy boulders, <2 octahedral/crystalline
# Distribution (Tier 2): which lattice points become stamps
coverage    = 1          # probabilistic keep per stamp (1 = all, 0.3 = sparse scatter)
bias        = 0          # 0 = uniform, 1 = contour (periodic Y bands → rings around hills)
biasspacing = 20         # contour: ring spacing in world Y
biaswidth   = 0.2        # contour: band half-width as fraction of spacing (0..0.5)
biasphase   = 0          # contour: ring offset
# Distribution gates (Tier 2): keep a stamp only if it passes all (defaults pass everything)
slopelo     = 0          # keep where steepness (deg) >= slopelo. 0=floor/ground, 90=wall, 180=ceiling
slopehi     = 180        # ... and <= slopehi. 30..90=cliffs, 0..15=flats, 100..180=overhangs/ceilings
altlo       = -10000     # keep where stamp world-Y >= altlo (snowline/shore bands)
althi       = 10000      # ... and <= althi
clusterfreq = 0          # >0 enables a 2D noise mask (patchy fields); 0 = uniform
clusterthresh = 0        # keep where cluster noise >= this (-1..1); higher = sparser patches
aspectlo    = 0          # keep where slope faces azimuth in [aspectlo,aspecthi] deg (0=+X, 90=+Z)
aspecthi    = 360
curvlo      = -9999      # keep where curvature >= curvlo (>0 convex/ridge, <0 concave/hollow)
curvhi      = 9999
# bias: 0=none, 1=contour (periodic elevation → rings), 2=ridge (periodic aspect → radial ribs)
# Operator (Tier 3)
carve       = 0          # 0 = add bumps, 1 = carve (subtract → pits/caves)
fuse        = 0          # 0 = hard crease between stamps, >0 = smooth metaball melt
# Propagation (Tier 4): carve + chain = tiling lumpy tunnels
chain       = 0          # # child stamps walked from each seed (0 = off)
chainstep   = 4          # distance between chain links
chainwander = 0.3        # 0 = straight, higher = winding

# ── Brush catalog: extremes-per-DOF test battery (all type = surface_blobs) ──────
# Shared baseline so each mode isolates ONE axis: amplitude=3, minradius=3 (uniform), frequency=0.12.
# blob_sphere = reference (all defaults). Tangent-stretch modes use smaller radius so horizontal reach <= overlap (4m).
[Mode:blob_sphere]
type = surface_blobs
blend = min
amplitude = 6
minradius = 6
frequency = 0.1

[Mode:blob_pnorm_lo]
type = surface_blobs
blend = min
amplitude = 6
minradius = 6
frequency = 0.1
pnorm = 1.3           # star / octahedral

[Mode:blob_pnorm_hi]
type = surface_blobs
blend = min
amplitude = 10
minradius = 10
frequency = 0.07
pnorm = 3             # boxy (sized up so flat faces span enough cells to resolve)

[Mode:blob_axial_lo]
type = surface_blobs
blend = min
amplitude = 6         # 6m radius = new seam limit at overlap=6 (was clipping at 10)
minradius = 6
frequency = 0.06
stretchn = 0.67       # disc / pancake — thickness = 6*0.67 = 4m (2 cells) so it resolves cleanly

[Mode:blob_axial_hi]
type = surface_blobs
blend = min
amplitude = 4          # 4m horizontal radius = seam limit; spike grows vertically (free)
minradius = 4
frequency = 0.1
stretchn = 5           # spike: 4m wide × 20m tall

[Mode:blob_crossslope]
type = surface_blobs
blend = min
amplitude = 2
minradius = 2
frequency = 0.08
stretcht = 3          # blade along contour: 6m long × 2m cross = 3:1 (reach 6 = overlap cap); cross-axis is 1 cell so expect jaggy

[Mode:blob_downslope]
type = surface_blobs
blend = min
amplitude = 2
minradius = 2
frequency = 0.08
stretchg = 3          # rib down the gradient (G): 6m long × 2m cross = 3:1 (reach 6 = overlap cap)

[Mode:blob_cone]
type = surface_blobs
blend = min
amplitude = 6
minradius = 6
frequency = 0.1
taper = 0.9           # linear cone

[Mode:blob_trumpet]
type = surface_blobs
blend = min
amplitude = 6
minradius = 6
frequency = 0.1
taper = 0.8
taperpow = 0.4        # concave / flared trumpet

[Mode:blob_ogive]
type = surface_blobs
blend = min
amplitude = 6
minradius = 6
frequency = 0.1
taper = 0.8
taperpow = 3          # convex / bullet / ogive

[Mode:blob_small]
type = surface_blobs
blend = min
amplitude = 3            # ~1.5 coarse-cell radius = resolution floor at coarseXZ/Y=2 (smaller aliases)
minradius = 3
frequency = 0.15

[Mode:blob_big]
type = surface_blobs
blend = min
amplitude = 10
minradius = 10
frequency = 0.05

[Mode:blob_spread]
type = surface_blobs
blend = min
amplitude = 8
minradius = 3         # full-range mix down to the ~3m resolution floor at coarse=2
frequency = 0.08

# Caves that grow inward: sparse surface mouths, carve a smooth winding tunnel into the mountain.
[Mode:blob_caves]
type = surface_blobs
blend = min
amplitude = 11           # MAX link radius; per-tunnel width class + along-path swell vary it organically
minradius = 4            # MIN link radius — wider [min,max] + width-class → some narrow passages
frequency = 0.08         # cave mouth spacing
coverage = 0.07          # sparser again now that it's visible
altlo = -10000
althi = 10000
slopelo = 30             # seed on flanks (real composed-surface normal)
slopehi = 150
carve = 1                # subtract → hollow out
fuse = 1.5               # smooth the beads/pearls into a tube (low enough that forks still read)
chain = 44               # longer tunnels (~220m); cost grows with length (latPad), dial back if loads chug
chainstep = 5            # < radius so links overlap into a smooth tube
chainwander = 0.25       # more jitter → organic, less glorious-uniform-tube (hk-keyed, still tiles)
chaininward = 0.8        # launch strongly inward along −N (into the mountainside)
branchprob = 0           # OFF while isolating a single tunnel to judge length/steering
branchangle = 55         # wide fork so branches clearly diverge
branchdepth = 1          # one level of branching (depth 2 explodes with this prob/length)
flowsteer = 0            # noise flow (off while testing branching)
flowfreq = 0.02
hubseek = 0              # off (was orbit-capping reach)
hubspacing = 256
keepdepth = 8            # (ignored when chaintile=1 — free 3D walk, no depth clamp)
chainlevel = 0.3         # gradual level-out: relax dir.y toward chainslope each step (dives in along −N, then settles)
chaintile = 1            # snap seed+walk to the GLOBAL composed surface (base ground + formation noise) → chains TILE across zones = full length, following the real surface (no vanilla bias)
chainslope = 0.12        # settle to a gentle downward drift (not dead flat) as it extends into the mountain
stretchg = 1.8           # elongate the stamp ALONG the path (G=travel dir) → smooth capsule tube, not beads
stretcht = 1.0           # cross-section width
stretchn = 1.0           # cross-section height
pnorm = 3                # cross-section shape: 2 round → higher squarer (3 ≈ rounded-square)
biomemajority = 1        # only tunnel where Mountain is the dominant biome; constant radius (no fade into neighbours)

# Large spines running along convex ridgelines (add + convex gate + along-ridge stretch + fuse into a crest).
[Mode:blob_spines]
type = surface_blobs
blend = min
amplitude = 2.2          # teeth a bit smaller still
minradius = 1.5
frequency = 0.15         # denser along the ridge (coverage already maxed at 1.0, so density comes from here)
coverage = 1.0           # convex gate does the selection → continuous crest
curvlo = -9999           # off — ridgeratio handles placement now
curvhi = 9999
bias = 0
ridgeratio = 2.5         # slightly higher curvature threshold → only sharper ridges
stretchg = 2             # elongate ALONG the ridgeline (slow axis) → fins/combs running down the crest
stretcht = 1
stretchn = 6             # taller (same base radius = amplitude; stretchn only scales height along N)
taper = 0.8              # pointed spike
taperpow = 2
fuse = 1
biomemajority = 1        # spines only where Mountain is dominant; constant size (no fade into neighbours)

# Stalactites: solid spikes hanging from CONCAVE cave/tunnel undersides (grow down the normal into the air).
[Mode:blob_teeth]
type = surface_blobs
blend = min              # ADD solid (min) — spikes protruding into the cave
amplitude = 2            # small
minradius = 1
frequency = 0.2          # dense
coverage = 0.5
skyopen = 0              # allow INTERNAL surfaces (cave ceilings) — the whole point
concaveratio = 2         # only anisotropic concave undersides (tube ceilings/domes), not flat/convex
slopelo = 110            # undersides only (N points downward: 90 wall → 180 ceiling)
slopehi = 180
stretchn = 5             # long spike along N (which points DOWN on a ceiling → hangs down)
taper = 0.95             # pointed
taperpow = 3
fuse = 0                 # discrete teeth, not a fused crest
biomemajority = 1
chaintile = 0            # local (no chains); per-zone field snap on the post-cave surface
[Mode:layered_isles]
type        = lua
file        = layered_isles.lua
blend       = min
amplitude   = 1
maskfreq    = 0.01
islethresh  = 0.32
islefade    = 0.12
islandbase  = 3
bluffheight = 30
layerstep   = 5
terrace     = 0.75
flare       = 2
noiseamp    = 2
noisefreq   = 0.05
detailfreq  = 0.03
warpamp     = 45
warpfreq    = 0.008
chanfreq    = 0.02
chanwidth   = 0.35
chancarve   = 0
chanwarp    = 25
chanwarpf   = 0.01

# ── Pipeline ──────────────────────────────────────────────────────────────────

[Pipeline]
modes = isotropic_formation, layered_isles, anisotropic_formation, formation_dev, dunes, gabor_ridges, contour_rings, surface_blobs, isotropic_tunnel, band_carve, tunnel_carve, blob_sphere, blob_pnorm_lo, blob_pnorm_hi, blob_axial_lo, blob_axial_hi, blob_crossslope, blob_downslope, blob_cone, blob_trumpet, blob_ogive, blob_small, blob_big, blob_spread, blob_caves, blob_spines

