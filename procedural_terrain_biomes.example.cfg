
# ProceduralTerrain — edit and save to hot-reload in-game
#
# Three-tier config: Modes → Profiles → Biomes
#   [Mode:name]     — named terrain primitive (type A/B/C/D + params)
#   [Profile:name]  — ordered list of mode names + profile-level params
#   [BiomeName]     — assigns a profile to a biome
#

[Bake]
bakeStep     = 4
compressBake = true

[Debug]
disableVegetation    = true
protectLocations     = true
islandRemoval        = true
pocketRemoval        = true
biomeBlendRadius     = 80
coastFade            = 48
biomeBlendSmooth     = true
transitionBlurPasses = 1
fixpointmaxzones     = 3

# ── Mode D ───────────────────────────────────────────────────────────────────

[Mode:coastal_ridges]
type       = D
amplitude  = 16
freqT      = 0.001
freqN      = 0.005
blurRadius = 128
alignment  = 1
vScale     = 0.1
